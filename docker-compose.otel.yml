services:
  app:
    environment:
      ENABLE_OTEL: "${ENABLE_OTEL:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT_DOCKER:-http://otel-collector:4317}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-promptman}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:-prompt-stack}"
      OTEL_DEPLOYMENT_ENVIRONMENT: "${OTEL_DEPLOYMENT_ENVIRONMENT:-dev}"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTEL_UPSTREAM_OTLP_ENDPOINT: "${OTEL_UPSTREAM_OTLP_ENDPOINT:-host.docker.internal:4317}"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
